<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>유플러스 업무 관리</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css"
    />
    <link rel="stylesheet" href="styles.css?v=20260921-7" />
  </head>
  <body>
    <div id="loadingBar" class="loading-bar" role="progressbar" aria-label="불러오는 중" aria-hidden="true"><span></span></div>
    <div id="authPage" class="auth-page" hidden>
      <form id="authForm" class="auth-card">
        <p class="home-brand">▥ WORK<span>FLOW</span></p>
        <h1 id="authTitle">로그인</h1>
        <p id="authDescription">업무 관리 계정으로 로그인해 주세요.</p>
        <label id="nameField" hidden
          >이름<input id="loginName" autocomplete="name"
        /></label>
        <label
          >아이디<input id="loginUsername" autocomplete="username" required
        /></label>
        <label
          >비밀번호<input
            id="loginPassword"
            type="password"
            autocomplete="current-password"
            minlength="8"
            required
        /></label>
        <button id="loginSubmit" type="submit">로그인</button>
        <button id="cancelLogin" type="button">로그인 없이 조회</button>
        <p id="authError" role="alert"></p>
      </form>
    </div>
    <div id="homePage" class="home-page">
      <div class="account-actions">
        <button type="button" data-login>로그인</button>
        <button id="usersButton" type="button" hidden>계정 관리</button>
      </div>
      <div class="home-content">
        <p class="home-brand">▥ WORK<span>FLOW</span></p>
        <h1>업무 관리</h1>
        <p class="home-description">관리할 워크스페이스를 선택해 주세요.</p>
        <nav class="workspace-cards" aria-label="워크스페이스 선택">
          <button type="button" data-workspace="cx">
            <strong>CX</strong
            ><span>CX 업무 관리 <b aria-hidden="true">↗</b></span>
          </button>
          <button type="button" data-workspace="enterprise">
            <strong>기업</strong
            ><span>기업 업무 관리 <b aria-hidden="true">↗</b></span>
          </button>
          <button type="button" data-workspace="aldot">
            <strong>알닷</strong
            ><span>알닷 업무 관리 <b aria-hidden="true">↗</b></span>
          </button>
        </nav>
      </div>
    </div>
    <div id="workspacePage" class="shell" hidden>
      <aside>
        <h2>▥ WORK<span>FLOW</span></h2>
        <small>WORKSPACE</small>
        <button class="active" data-workspace="cx">CX</button>
        <button data-workspace="enterprise">기업</button>
        <button data-workspace="aldot">알닷</button>
      </aside>
      <main>
        <header>
          <button
            id="goHome"
            class="home-button"
            type="button"
            aria-label="메인페이지로 이동"
          >
            ⌂ 메인
          </button>
          <h1>CX 업무 관리</h1>
          <label
            >⌕
            <input id="search" placeholder="업무명, 작업자, RMS 검색" /></label
          ><button
            id="refresh"
            type="button"
            aria-label="서버에서 최신 업무 불러오기"
            title="서버에서 최신 업무 불러오기"
          >
            ↻
          </button>
          <div class="workspace-account-actions">
            <button id="historyButton" type="button">수정 이력</button>
            <button type="button" data-login>로그인</button>
            <button id="logoutButton" type="button" hidden>로그아웃</button>
            <span id="currentUser"></span>
          </div>
          <i>CX</i>
        </header>
        <section>
          <article class="panel">
            <div class="panel-toolbar">
              <div class="month-control">
                <button
                  class="icon-button"
                  id="prevMonth"
                  type="button"
                  aria-label="이전 달"
                >
                  ‹
                </button>
                <strong id="monthLabel" aria-live="polite"></strong>
                <button
                  class="icon-button"
                  id="nextMonth"
                  type="button"
                  aria-label="다음 달"
                >
                  ›
                </button>
              </div>
              <div id="editHint" class="task-actions">
                <div
                  class="action-group action-group-secondary"
                  role="group"
                  aria-label="업무 정리"
                >
                  <button id="carryOver" type="button">이월</button>
                  <button id="deleteToggle">삭제</button>
                </div>
                <div
                  class="action-group"
                  role="group"
                  aria-label="업무 작성 및 저장"
                >
                  <button id="newTask">＋ 새 업무</button>
                  <button
                    id="saveAll"
                    disabled
                    title="자동 저장 실패 시 즉시 다시 저장합니다."
                  >
                    저장
                  </button>
                </div>
              </div>
            </div>
            <div class="tools">
              <div>
                <button class="active" data-tab="active">진행중</button>
                <button data-tab="list">전체</button>
              </div>
              <span
                ><select id="worker">
                  <option value="all">전체 작업자</option></select
                ><select id="status">
                  <option value="all">전체 단계</option>
                </select></span
              >
            </div>
            <div
              id="workSummary"
              class="work-summary"
              aria-label="담당자별 작업시간"
            ></div>
            <div id="list" class="table">
              <table>
                <colgroup>
                  <col class="col-registration" />
                  <col class="col-rms" />
                  <col class="col-worker" />
                  <col class="col-status" />
                  <col class="col-date" />
                  <col class="col-title" />
                  <col class="col-notes" />
                  <col class="col-hours" />
                  <col class="col-adjustment" />
                </colgroup>
                <thead>
                  <tr>
                    <th>등록</th>
                    <th>RMS</th>
                    <th>작업자</th>
                    <th>단계</th>
                    <th>완료 &amp; 반영일</th>
                    <th>업무제목</th>
                    <th>비고</th>
                    <th>작업시간</th>
                    <th>조정</th>
                  </tr>
                </thead>
                <tbody id="rows"></tbody>
              </table>
            </div>
            <footer>
              <div class="sync-details"><span id="count"></span></div>
              <span id="saveStatus" role="status" aria-live="polite"
                >● Apps Script 연결 대기</span
              >
            </footer>
          </article>
        </section>
      </main>
    </div>
    <dialog id="usersDialog">
      <form method="dialog" class="dialog-card">
        <header>
          <h2>계정 관리</h2>
          <button value="cancel" aria-label="닫기">×</button>
        </header>
        <div id="userList"></div>
        <h3>계정 추가</h3>
        <label>이름<input id="newUserName" /></label
        ><label>아이디<input id="newUsername" /></label
        ><label
          >비밀번호<input
            id="newUserPassword"
            type="password"
            minlength="8" /></label
        ><label
          >권한<select id="newUserRole">
            <option value="editor">편집자</option>
            <option value="admin">관리자</option>
          </select></label
        ><button id="createUserButton" type="button">계정 생성</button>
        <p id="userError" role="alert"></p>
      </form>
    </dialog>
    <dialog id="historyDialog">
      <form method="dialog" class="dialog-card history-card">
        <header>
          <h2>수정 이력</h2>
          <button value="cancel" aria-label="닫기">×</button>
        </header>
        <div id="historyList"></div>
      </form>
    </dialog>
    <script src="config.js?v=20260921-19"></script>
    <script src="app.js?v=20260921-12"></script>
  </body>
</html>
